[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roundup"
version = "0.1.0"
description = "End-to-end machine learning project for transaction roundup prediction"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["roundup*"]