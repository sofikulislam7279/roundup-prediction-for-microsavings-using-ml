name: Jomao CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


jobs:

  # ==========================================================
  # CI - Test Application
  # ==========================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Check Python syntax
        run: |
          python -m compileall roundup app.py gradio_app.py


      - name: Test application import
        run: |
          python -c "import app; print('FastAPI application import successful')"



  # ==========================================================
  # CD - Deploy to Hugging Face Gradio Space
  # ==========================================================

  deploy:
    name: Deploy to Hugging Face
    runs-on: ubuntu-latest

    needs:
      - test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Create or verify Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf repos create sofikulislam/jomao-roundup-prediction \
            --type space \
            --exist-ok

      - name: Sync repository to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: sofikulislam/jomao-roundup-prediction
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: gradio